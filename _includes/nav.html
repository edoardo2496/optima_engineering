<nav>
  <a class="nav-logo" href="{{ '/' | relative_url }}">
    <img src="{{ '/assets/logo.png' | relative_url }}" alt="" class="nav-logo-img">
    <span class="nav-logo-text">Optima <span>Engineering</span></span>
  </a>
  <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Apri menu">
  <label for="menu-toggle" class="menu-btn"><span></span></label>
  <ul class="nav-links">
    <li><a href="{{ '/#servizi' | relative_url }}">Servizi</a></li>
    <li><a href="{{ '/#processo' | relative_url }}">Come lavoro</a></li>
    <li><a href="{{ '/blog.html' | relative_url }}">Articoli</a></li>
    <li><a href="{{ '/#contatto' | relative_url }}" class="nav-cta">Parliamone</a></li>
  </ul>
</nav>
<script>
  // chiude il menu mobile dopo il click su un link
  document.querySelectorAll('.nav-links a').forEach(a =>
    a.addEventListener('click', () => document.getElementById('menu-toggle').checked = false));

  // sfondo scuro della barra dopo lo scroll
  const navEl = document.querySelector('nav');
  const onScroll = () => navEl.classList.toggle('scrolled', window.scrollY > 50);
  window.addEventListener('scroll', onScroll);
  onScroll();
</script>
