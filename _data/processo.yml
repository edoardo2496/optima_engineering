- titolo: Diagnosi
  testo: Mappiamo fonti dati, processi e obiettivi in un primo colloquio. Prima si capisce il problema, poi si decide se e come intervenire.
- titolo: Progetto
  testo: Definiamo l'architettura più semplice in grado di risolverlo, con perimetro, tempi e costi concordati prima di iniziare.
- titolo: Costruzione
  testo: Sviluppiamo il flusso dei dati e lo portiamo in produzione per fasi, con verifiche periodiche sui risultati.
- titolo: Consegna
  testo: Il sistema passa a te, completo di documentazione e formazione per il tuo team, che potrà gestirlo in autonomia.
